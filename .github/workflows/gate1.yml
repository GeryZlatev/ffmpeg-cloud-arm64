name: Gate 1 ARM64 musl audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate recipe
        run: |
          bash -n scripts/*.sh
          python3 scripts/lint.py
      - name: Two clean native ARM64 builds and capability tests
        run: bash scripts/run.sh
      - name: Upload audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate1-audit-${{ github.sha }}
          path: |
            dist/reproducibility.json
            dist/first/audit/
            dist/second/audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload inspected binaries and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate1-package-and-source-${{ github.sha }}
          path: |
            dist/first/*.tar.gz
            dist/first/ARCHIVE-SHA256SUMS
            dist/first/package/BUILD-MANIFEST.json
            dist/first/package/SOURCE-MANIFEST.json
            dist/first/package/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
